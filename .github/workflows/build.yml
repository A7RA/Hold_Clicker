name: Build Ra Clicker APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          # Download from Maven Central — reliable, versioned
          curl -fsSL \
            "https://repo1.maven.org/maven2/org/gradle/wrapper/gradle-wrapper/8.11.1/gradle-wrapper-8.11.1.jar" \
            -o gradle/wrapper/gradle-wrapper.jar \
          || curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/refs/tags/v8.11.1/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          ls -lh gradle/wrapper/gradle-wrapper.jar

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Show versions
        run: |
          cat gradle/wrapper/gradle-wrapper.properties
          head -5 gradle/libs.versions.toml

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ra-clicker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
